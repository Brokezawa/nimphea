name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Nim Check & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false  # libDaisy not needed for host-side tests

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.8'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Syntax check core module
        run: nim check src/nimphea.nim

      - name: Syntax check every module
        run: |
          for f in $(find src -name '*.nim' | sort); do
            nim check --hints:off "$f" || exit 1
          done

      - name: Check for duplicate C++-backed types
        run: nim e scripts/check_duplicate_types.nims

      - name: Run unit tests
        run: nim e scripts/test.nims